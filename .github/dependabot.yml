# Dependabot opens one pull request a week for the modules of the tool and one for the pinned
# actions. CI runs on the push of its branch, as on any other branch.
#
# Its commits are Conventional Commits, as CI asks. A new module can fix a hole in the tool,
# so "fix(deps):" makes a patch release. A new action changes only CI, so "ci(deps):"
# makes no release.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-modules:
        patterns: ["*"]
    ignore:
      # go.mod replaces it with the copy in third_party, so its version in go.mod has no
      # effect. The copy is updated by hand: see third_party/gokeepasslib/PATCHES.md.
      - dependency-name: github.com/tobischo/gokeepasslib/v3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
